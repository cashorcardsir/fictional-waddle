name: Update ad filters

on:
  workflow_dispatch:
#  schedule:
#    - cron: '3,13,23,33,43,53 * * * *' 
#      timezone: 'Asia/Kolkata'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and deduplicate domains
        run: pip install dnspython && python3 scripts/extract_filters.py

      - name: Commit changes
        run: |
          if ! git diff --quiet -- filters.txt add-domains.txt; then
            git pull origin main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add filters.txt add-domains.txt
            git commit -m "Update adblock filters"
            git push
          fi
